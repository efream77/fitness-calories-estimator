<!DOCTYPE html>
<html>
<head>
    <title>Fitness Calorie Estimator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="card-title text-center mb-4">Fitness Calorie Estimator</h2>

        
        <!-- Form -->
        <form action="/predict" method="post">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Age:</label>
                    <input type="number" name="age" step="1" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Gender:</label>
                    <select name="gender" class="form-control" required>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Height (ft):</label>
                    <input type="number" name="height" step="0.1" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Weight (lbs):</label>
                    <input type="number" name="weight" step="1" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Duration (min):</label>
                    <input type="number" name="duration" step="1" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Heart Rate:</label>
                    <input type="number" name="heart_rate" step="1" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Body Temp (°F):</label>
                    <input type="number" name="body_temp" step="0.1" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Activity:</label>
                    <select name="activity" class="form-control" required>
                        {% for act in activities %}
                        <option>{{ act }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Predict Calories</button>
        </form>

        <button onclick="document.body.classList.toggle('dark-mode')" class="btn btn-secondary w-100 mt-2">Toggle Dark Mode</button>

        <p class="mt-3 text-center">
            Check out our <a href="https://example.com" target="_blank" style="color: #007bff; text-decoration: underline;">Workout Guide</a>
        </p>

        <br>
        <a href="/download" class="btn btn-success w-100">Download Your Predictions</a>
    </div>
</div>

<script>
document.querySelector("form").addEventListener("submit", function(e) {
    const age = parseFloat(document.querySelector("input[name='age']").value);
    const height = parseFloat(document.querySelector("input[name='height']").value);
    const weight = parseFloat(document.querySelector("input[name='weight']").value);
    const duration = parseFloat(document.querySelector("input[name='duration']").value);
    const heart_rate = parseFloat(document.querySelector("input[name='heart_rate']").value);
    const body_temp = parseFloat(document.querySelector("input[name='body_temp']").value);

    if (age <= 0 || height <= 0 || weight <= 0 || duration <= 0 || heart_rate <= 0 || body_temp <= 0) {
        alert("All numerical values must be positive!");
        e.preventDefault();
        return;
    }

    if (heart_rate < 30 || heart_rate > 200) {
        alert("Heart rate must be between 30 and 200.");
        e.preventDefault();
        return;
    }

    if (body_temp < 95 || body_temp > 105) {
        alert("Body temperature must be between 95°F and 105°F.");
        e.preventDefault();
        return;
    }
});

</script>

</body>
</html>
